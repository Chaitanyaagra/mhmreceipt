<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">

<style>
  body{ background:var(--paper); }
  .st-shell{ max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  #screen-login.active{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{ width:100%; max-width:360px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px 24px; }
  .login-card h1{ font-size:18px; margin:0 0 4px; text-align:center; }
  .login-card p{ font-size:12.5px; color:var(--ink-500); margin:0 0 20px; text-align:center; }
  #loginError{ display:none; color:var(--danger); font-size:12.5px; margin-bottom:10px; }
  .screen{ display:none; }
  .screen.active{ display:block; }
  .st-header{ display:flex; align-items:center; justify-content:space-between; padding:16px; background:var(--navy-900); color:#fff; }
  .st-header .who b{ display:block; font-size:15px; }
  .st-header .who span{ font-size:11.5px; color:rgba(255,255,255,.6); }
  .st-header button{ background:rgba(255,255,255,.1); border:none; color:#fff; padding:7px 12px; border-radius:8px; font-size:12px; }
  .st-tabs{ display:flex; gap:4px; padding:10px 12px; background:var(--navy-900); }
  .st-tab{ flex:1; padding:8px; border-radius:8px; background:transparent; border:none; color:rgba(255,255,255,.65); font-size:12.5px; font-weight:600; }
  .st-tab.active{ background:rgba(255,255,255,.14); color:#fff; }
  .st-body{ padding:16px; padding-bottom:40px; }
  .type-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .type-card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px 12px; text-align:center; }
  .type-card b{ display:block; font-size:13px; margin-top:6px; }
  .chk-section{ background:#fff; border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .chk-section-head{ padding:12px 14px; font-weight:700; font-size:13.5px; background:var(--paper); border-bottom:1px solid var(--line); }
  .chk-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .chk-row:last-child{ border-bottom:none; }
  .chk-label{ font-size:12.5px; flex:1; }
  .chk-toggle{ display:flex; gap:4px; flex-shrink:0; }
  .chk-btn{ padding:9px 14px; min-height:38px; border-radius:7px; font-size:13px; font-weight:700; border:1px solid var(--line); background:#fff; color:var(--ink-500); }
  .chk-btn.ok-on{ background:var(--success-bg); color:var(--success); border-color:var(--success-line); }
  .chk-btn.issue-on{ background:var(--danger-bg); color:var(--danger); border-color:var(--danger-line); }
  .chk-note{ padding:0 14px 10px; }
  .chk-note input{ width:100%; font-size:12px; padding:7px 10px; border-radius:7px; border:1px solid var(--line); }
  .cx-row{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
</style>
</head>
<body>

<!-- ============================= LOGIN ============================= -->
<div class="screen active" id="screen-login">
  <div class="login-card">
    <h1>Staff App</h1>
    <p>Max Heights Majestic RWS — Facility Team</p>
    <form id="loginForm">
      <div class="field"><label for="loginId">Login ID</label><input type="text" id="loginId" autocomplete="off" autocapitalize="characters" placeholder="e.g. S001" required></div>
      <div class="field"><label for="loginPin">PIN</label><input type="password" id="loginPin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="6-digit PIN" required></div>
      <div id="loginError"></div>
      <button class="btn btn-primary" type="submit" style="width:100%;">Sign In</button>
      <p class="t-muted" style="font-size:12px; text-align:center; margin-top:10px;">Forgotten your PIN? Ask your Managing Staff or the admin to set up a new login.</p>
    </form>
  </div>
</div>

<!-- ============================= MAIN ============================= -->
<div class="screen" id="screen-main">
  <div class="st-shell">
    <div class="st-header">
      <div class="who"><b id="staffNameLabel">—</b><span id="staffRoleLabel"></span></div>
      <button id="logoutBtn">Sign Out</button>
    </div>
    <div class="st-tabs">
      <button class="st-tab active" data-tab="home">Home</button>
      <button class="st-tab" data-tab="inspect">New Inspection</button>
      <button class="st-tab" data-tab="history">History</button>
      <button class="st-tab" data-tab="complaints">Complaints</button>
      <button class="st-tab" data-tab="team" id="teamTabBtn" style="display:none;">Team</button>
    </div>
    <div class="st-body">
      <div class="tab-panel" id="tab-home"></div>
      <div class="tab-panel" id="tab-inspect" style="display:none;"></div>
      <div class="tab-panel" id="tab-history" style="display:none;"></div>
      <div class="tab-panel" id="tab-complaints" style="display:none;"></div>
      <div class="tab-panel" id="tab-team" style="display:none;"></div>
    </div>
  </div>
</div>

<div id="toast-region"></div>

<script src="./update-banner.js"></script>
<script src="./back-button-handler.js"></script>
<!-- Service worker registration lives here, not in the Firebase module —
     same reasoning as index.html: if the SDK fails to load, offline
     support and installability shouldn't silently never register. -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch((e) => console.warn('Service worker registration failed:', e));
  });
}
</script>

<script type="module">
import { auth, db, storage } from './firebase-config.js';
import {
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  doc, getDoc, addDoc, setDoc, updateDoc, collection, query, where, getDocs, orderBy, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import {
  ref as storageRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";
import { showToast, escapeHtml, fmtDate, fmtDateTime, TOWER_IDS, TOWER_PLAN, INSPECTION_TYPES, INSPECTION_SCHEDULE, INSPECTION_CRITICAL_ITEMS, DEFECT_TAG_OPTIONS, inspectionSectionToComplaintCategory, STAFF_TRADES, dateToLocalISO, todayLocalISO, complaintUrgency, COMPLAINT_SLA_HOURS } from './app-common.js';
import { installOfflineBanner } from './ui-a11y.js';
import { installAppInstallPrompt } from './install-prompt.js';
installOfflineBanner();
installAppInstallPrompt({ appName: 'MHMRWS Staff', showToast });

let currentStaff = null; // {uid, name, role}
let draft = null;        // in-progress inspection {formType, tower, sections:[{title, items:[{label,status,note,priority}]}]}
let inspectionSubmitInFlight = false; window.__appBusy = false;

/* ---------------------------------------------------------------------- */
/*  Draft autosave/recovery — localStorage, debounced                      */
/* ---------------------------------------------------------------------- */
function draftStorageKey() { return `mhmrws_insp_draft_${currentStaff?.uid || 'unknown'}`; }
let draftSaveTimer = null;
function saveDraftToLocalStorage() {
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(() => {
    if (!draft) return;
    try {
      // photoFile is a real File object — not JSON-serializable, and not
      // meaningful to restore anyway (the browser can't hand back a
      // picked file after a reload). Keep everything else, including any
      // photoURL that already finished uploading before the interruption.
      const serializable = {
        ...draft,
        sections: draft.sections.map((sec) => ({
          ...sec,
          items: sec.items.map((it) => { const { photoFile, ...rest } = it; return rest; })
        })),
        ...(draft.tankPhotos ? {
          tankPhotos: Object.fromEntries(Object.entries(draft.tankPhotos).map(([tower, checks]) =>
            [tower, checks.map((c) => { const { photoFile, ...rest } = c; return rest; })]
          ))
        } : {}),
        savedAt: Date.now()
      };
      localStorage.setItem(draftStorageKey(), JSON.stringify(serializable));
    } catch (e) { console.warn('Could not autosave draft:', e); }
  }, 800);
}
function clearSavedDraft() {
  clearTimeout(draftSaveTimer);
  try { localStorage.removeItem(draftStorageKey()); } catch (e) { /* non-fatal */ }
}
function loadSavedDraft() {
  try {
    const raw = localStorage.getItem(draftStorageKey());
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
let myInspections = [];
let myComplaints = [];

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}
let currentStaffTab = 'home';
function showTab(name) {
  currentStaffTab = name;
  document.querySelectorAll('.st-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.getElementById('tab-' + name).style.display = 'block';
  if (name === 'home') renderHome();
  if (name === 'inspect') { if (draft) renderChecklist(); else loadInspectionAssignments().then(renderInspectPicker); }
  if (name === 'history') renderHistory();
  if (name === 'complaints') renderComplaints();
  if (name === 'team') renderTeam();
}
document.querySelectorAll('.st-tab').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
// Back button: from any tab other than Home, back returns to Home rather
// than exiting the app.
if (window.__registerBackStep) {
  window.__registerBackStep(() => {
    if (currentStaffTab !== 'home') { showTab('home'); return true; }
    return false;
  });
}

/* ---------------------------------------------------------------------- */
/*  Login                                                                  */
/* ---------------------------------------------------------------------- */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginId = document.getElementById('loginId').value.trim().toUpperCase();
  const pin = document.getElementById('loginPin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!loginId || !pin) return;
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, `${loginId.toLowerCase()}@mhmrws-portal.local`, pin);
  } catch (err) {
    errEl.textContent = 'Incorrect Login ID or PIN.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});
document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    clearTimeout(draftSaveTimer);
    draftSaveTimer = null;
    draft = null;
    currentStaff = null;
    myInspections = [];
    myComplaints = [];
    inspectionsLoadFailed = false;
    complaintsLoadFailed = false;
    inspectionsForReview = [];
    allStaffList = [];
    allInspectionAssignments = [];
    showScreen('screen-login');
    return;
  }
  try {
    const snap = await getDoc(doc(db, 'staff', user.uid));
    if (!snap.exists() || snap.data().active === false) {
      const errEl = document.getElementById('loginError');
      errEl.textContent = 'This staff account is not active. Contact the committee.';
      errEl.style.display = 'block';
      await signOut(auth);
      return;
    }
    currentStaff = { uid: user.uid, ...snap.data() };
    document.getElementById('staffNameLabel').textContent = currentStaff.name || 'Staff';
    document.getElementById('staffRoleLabel').textContent = currentStaff.role === 'manager' ? 'Managing Staff' : 'Supervisor';
    document.getElementById('teamTabBtn').style.display = currentStaff.role === 'manager' ? '' : 'none';
    showScreen('screen-main');
    await Promise.all([loadMyInspections(), loadComplaints(), loadInspectionAssignments(), loadInspectionsForReview()]);
    showTab('home');
  } catch (err) {
    console.error('Staff profile load failed:', err);
    const errEl = document.getElementById('loginError');
    errEl.textContent = 'Could not verify this account — check your connection and try again.';
    errEl.style.display = 'block';
    await signOut(auth);
  }
});

/* ---------------------------------------------------------------------- */
/*  Data loads                                                             */
/* ---------------------------------------------------------------------- */
let inspectionsLoadFailed = false;
async function loadMyInspections() {
  try {
    const snap = await getDocs(query(collection(db, 'inspections'), where('createdByUid', '==', currentStaff.uid)));
    myInspections = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    inspectionsLoadFailed = false;
  } catch (e) { console.warn('Inspection history load failed:', e?.code || e); myInspections = []; inspectionsLoadFailed = true; }
}
let inspectionsForReview = [];
async function loadInspectionsForReview() {
  if (currentStaff.role !== 'manager') return;
  try {
    const cutoff = Date.now() - 30 * 86400000;
    const [flaggedSnap, recentSnap] = await Promise.all([
      getDocs(query(collection(db, 'inspections'), where('pendingManagerReview', '==', true))),
      getDocs(query(collection(db, 'inspections'), where('createdAt', '>=', new Date(cutoff))))
    ]);
    const byId = new Map();
    [...flaggedSnap.docs, ...recentSnap.docs].forEach((d) => byId.set(d.id, { id: d.id, ...d.data() }));
    inspectionsForReview = [...byId.values()]
      .filter((r) => !r.managerVerificationStatus)
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  } catch (e) { console.warn('Inspections-for-review load failed:', e?.code || e); inspectionsForReview = []; }
}
let allStaffList = [];
let complaintsLoadFailed = false;
async function loadComplaints() {
  try {
    // A Managing Staff triages the whole queue; a Supervisor may only read
    // complaints assigned to them (enforced by the rule now, not just the
    // UI). The query must match: a supervisor filters on assignedToUid, so
    // other residents' complaints never even reach their browser.
    let snap;
    if (currentStaff.role === 'manager') {
      snap = await getDocs(collection(db, 'complaints'));
    } else {
      snap = await getDocs(query(collection(db, 'complaints'), where('assignedToUid', '==', currentStaff.uid)));
    }
    myComplaints = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    complaintsLoadFailed = false;
  } catch (e) { console.warn('Complaints load failed:', e?.code || e); myComplaints = []; complaintsLoadFailed = true; }

  // Managing Staff needs the staff list to assign complaints to supervisors.
  if (currentStaff.role === 'manager' && !allStaffList.length) {
    try {
      allStaffList = (await getDocs(collection(db, 'staff'))).docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { console.warn('Staff list load failed:', e?.code || e); }
  }
}

let allInspectionAssignments = [];
let inspectionAssignmentsLoadFailed = false;
async function loadInspectionAssignments() {
  try {
    allInspectionAssignments = (await getDocs(collection(db, 'inspectionAssignments'))).docs.map(d => ({ id: d.id, ...d.data() }));
    inspectionAssignmentsLoadFailed = false;
  } catch (e) {
    console.warn('Inspection assignments load failed:', e?.code || e);
    allInspectionAssignments = [];
    inspectionAssignmentsLoadFailed = true;
  }
}

// One row per schedulable slot: each of the 7 towers' Daily Tower Common
// Area checklist, plus one each for the society-wide daily/weekly types.
// Mirrors admin.html's renderInspectionSchedule() grouping so a slot here
// means the same thing there.
function allAssignableSlots() {
  const slots = [];
  for (const [type, sched] of Object.entries(INSPECTION_SCHEDULE)) {
    const label = INSPECTION_TYPES[type]?.label || type;
    if (sched.perTower) {
      TOWER_IDS.forEach(t => slots.push({ slotId: `${type}_${t}`, formType: type, tower: t, label: `${label} — Tower ${t}` }));
    } else {
      slots.push({ slotId: type, formType: type, tower: null, label });
    }
  }
  return slots;
}

/* ---------------------------------------------------------------------- */
/*  Team tab (Managing Staff only) — who's responsible for what           */
/* ---------------------------------------------------------------------- */
async function verifyInspection(inspectionId, status) {
  let remarks = '';
  if (status === 'needs_correction') {
    remarks = prompt('What needs to be corrected? This will be visible to admin and the staff who filed it.') || '';
    if (!remarks.trim()) { showToast('Please describe what needs correction.', 'error'); return; }
    if (remarks.length > 1000) { remarks = remarks.slice(0, 1000); showToast('Note was shortened to 1000 characters.', 'info'); }
  }
  try {
    await updateDoc(doc(db, 'inspections', inspectionId), {
      managerVerificationStatus: status,
      managerVerifiedBy: currentStaff.name,
      managerVerifiedByUid: currentStaff.uid,
      managerVerifiedAt: serverTimestamp(),
      pendingManagerReview: false,
      ...(remarks.trim() ? { managerRemarks: remarks.trim() } : {})
    });
    inspectionsForReview = inspectionsForReview.filter((r) => r.id !== inspectionId);
    renderTeam();
    showToast(status === 'verified' ? 'Marked as verified.' : 'Marked as needing correction.', 'success');
  } catch (err) {
    console.error('Inspection review failed:', err);
    showToast(`Could not save your review${err?.code ? ` (${err.code})` : ''} — please try again.`, 'error');
  }
}

function renderTeam() {
  const el = document.getElementById('tab-team');
  const supervisors = allStaffList.filter(s => s.active !== false && s.role === 'supervisor');
  const slots = allAssignableSlots();
  el.innerHTML = `
    <div class="card card-pad" style="margin-bottom:12px;">
      <h3 style="font-size:15px; margin-bottom:4px;">Review Submitted Inspections</h3>
      <p class="t-muted" style="font-size:12px; margin-bottom:${inspectionsForReview.length ? '10px' : '0'};">Mark a filed inspection as reviewed, from your own login — a typed "Verified By" name on the form isn't a real review. Last 30 days, not yet reviewed.</p>
      ${!inspectionsForReview.length ? `<p class="t-muted" style="font-size:12.5px;">Nothing waiting on review right now.</p>` : inspectionsForReview.map((r, i) => `
        <div style="border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px;">
          <div class="spread">
            <b style="font-size:13px;">${escapeHtml(INSPECTION_TYPES[r.formType]?.label || r.formType)}${r.tower ? ' — Tower ' + escapeHtml(r.tower) : ''}</b>
            <span class="t-muted" style="font-size:11px;">${r.createdAt ? fmtDateTime(r.createdAt) : ''}</span>
          </div>
          <div class="t-muted" style="font-size:11.5px; margin:2px 0 8px;">Filed by ${escapeHtml(r.createdByName || '—')}${Number(r.issueCount) ? ` · ${Number(r.issueCount)} issue${Number(r.issueCount) > 1 ? 's' : ''}` : ''}${Number(r.uncheckedCount) ? ` · ${Number(r.uncheckedCount)} unchecked` : ''}</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap;">
            <button type="button" class="btn btn-primary btn-sm" data-verify-insp="${i}">Verify</button>
            <button type="button" class="btn btn-outline btn-sm" data-correct-insp="${i}">Needs Correction</button>
          </div>
        </div>`).join('')}
    </div>
    <div class="card card-pad" style="margin-bottom:12px;">
      <h3 style="font-size:15px; margin-bottom:4px;">Assign Inspections</h3>
      <p class="t-muted" style="font-size:12px;">Decide who's responsible for each daily and weekly check. Leave "Unassigned" and any supervisor (and you) can still pick it up from New Inspection.</p>
    </div>
    ${!supervisors.length ? `<p class="t-muted" style="font-size:12.5px;">No supervisors added yet — add one from the admin panel's Facility Staff section first.</p>` : ''}
    ${slots.map(slot => {
      const current = allInspectionAssignments.find(a => a.id === slot.slotId);
      const curUid = current?.assignedToUid || '';
      return `
      <div class="card card-pad" style="margin-bottom:10px;">
        <div style="font-weight:700; font-size:13.5px; margin-bottom:8px;">${escapeHtml(slot.label)}</div>
        <select data-slot="${slot.slotId}" data-form-type="${slot.formType}" data-tower="${slot.tower || ''}">
          <option value="">Unassigned</option>
          <option value="${escapeHtml(currentStaff.uid)}" ${curUid === currentStaff.uid ? 'selected' : ''}>Myself (${escapeHtml(currentStaff.name)})</option>
          ${supervisors.map(s => `<option value="${escapeHtml(s.id)}" ${curUid === s.id ? 'selected' : ''}>${escapeHtml(s.name)}${STAFF_TRADES[s.trade] ? ' — ' + STAFF_TRADES[s.trade].label : ''}</option>`).join('')}
        </select>
      </div>`;
    }).join('')}
  `;
  el.querySelectorAll('select[data-slot]').forEach(sel => sel.addEventListener('change', () => saveAssignment(sel)));
  el.querySelectorAll('[data-verify-insp]').forEach(b => b.onclick = () => verifyInspection(inspectionsForReview[Number(b.dataset.verifyInsp)].id, 'verified'));
  el.querySelectorAll('[data-correct-insp]').forEach(b => b.onclick = () => verifyInspection(inspectionsForReview[Number(b.dataset.correctInsp)].id, 'needs_correction'));
}

async function saveAssignment(sel) {
  const slotId = sel.dataset.slot;
  const formType = sel.dataset.formType;
  const tower = sel.dataset.tower || null;
  const uid = sel.value || null;
  const previousUid = allInspectionAssignments.find(a => a.id === slotId)?.assignedToUid || '';
  const supervisors = allStaffList.filter(s => s.role === 'supervisor');
  const name = !uid ? null : (uid === currentStaff.uid ? currentStaff.name : (supervisors.find(s => s.id === uid)?.name || null));
  sel.disabled = true;
  try {
    const payload = {
      formType,
      assignedToUid: uid, assignedToName: name,
      assignedByUid: currentStaff.uid, assignedByName: currentStaff.name,
      updatedAt: serverTimestamp()
    };
    if (tower) payload.tower = tower;
    await setDoc(doc(db, 'inspectionAssignments', slotId), payload);
    const idx = allInspectionAssignments.findIndex(a => a.id === slotId);
    const updated = { id: slotId, ...payload };
    if (idx >= 0) allInspectionAssignments[idx] = updated; else allInspectionAssignments.push(updated);
    showToast('Assignment saved.', 'success');
  } catch (e) {
    console.error('Save assignment failed:', e);
    showToast('Could not save — please try again.', 'error');
    sel.value = previousUid;
  } finally { sel.disabled = false; }
}

async function submitLogIssue() {
  const title = document.getElementById('liTitle').value.trim();
  const description = document.getElementById('liDesc').value.trim();
  const category = document.getElementById('liCategory').value;
  const priority = document.getElementById('liPriority').value;
  const tower = document.getElementById('liTower').value || null;
  const location = document.getElementById('liLocation').value.trim() || null;
  const photoFile = document.getElementById('liPhoto').files?.[0];
  if (!title) { showToast('Please describe the issue.', 'error'); return; }
  if (!description) { showToast('Please add some details.', 'error'); return; }
  if (priority === 'high' && !photoFile) { showToast('High priority issues need a photo.', 'error'); return; }

  const btn = document.getElementById('liSubmitBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    let photoURL = null;
    if (photoFile) {
      const r = storageRef(storage, `complaintPhotos/${currentStaff.uid}/issue_${Date.now()}`);
      await uploadBytes(r, photoFile);
      photoURL = await getDownloadURL(r);
    }
    const payload = {
      raisedByUid: currentStaff.uid, title, description, category, status: 'open', source: 'staff-manual', priority,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    };
    if (photoURL) payload.photoURL = photoURL;
    if (tower) payload.tower = tower;
    if (location) payload.location = location;
    await addDoc(collection(db, 'complaints'), payload);
    showToast('Issue logged.', 'success');
    homeView = 'main';
    await loadComplaints();
    renderHome();
  } catch (err) {
    console.error('Log issue failed:', err);
    showToast(`Could not submit${err?.code ? ` (${err.code})` : ''} — please try again.`, 'error');
    btn.disabled = false; btn.textContent = 'Submit';
  }
}

const TYPE_ICON = { 'daily-tower': '🏢', 'weekly-mep': '⚙️', 'daily-security': '🛡️', 'club-house': '🏊' };

function isSlotAvailableToMe(formType, tower) {
  if (currentStaff.role === 'manager') return true;
  const slotId = tower ? `${formType}_${tower}` : formType;
  const a = allInspectionAssignments.find(x => x.id === slotId);
  return !!a && a.assignedToUid === currentStaff.uid;
}

function floorSectionsForTower(tower) {
  const tpl = INSPECTION_TYPES['daily-tower'];
  const floorCount = (TOWER_PLAN[tower]?.floors ?? (tpl.floors.length - 1)) + 1; // Ground (level 0) through the tower's top floor, inclusive
  return tpl.floors.slice(0, floorCount).map(floor => ({
    title: floor + ' Floor',
    items: tpl.floorItems.map(label => ({ label: floor + ' — ' + label, status: null, note: '', priority: INSPECTION_CRITICAL_ITEMS.has(label) ? 'high' : 'medium' }))
  }));
}

function startInspection(formType) {
  const tpl = INSPECTION_TYPES[formType];
  let sections = [];
  if (formType === 'daily-tower') {
    // Tower not chosen yet at this point — generate against the first
    // selectable tower as a reasonable initial guess; the real, correct
    // set is regenerated the moment a tower is actually picked, below.
    const firstTower = TOWER_IDS.find(t => isSlotAvailableToMe('daily-tower', t)) || TOWER_IDS[0];
    sections = floorSectionsForTower(firstTower);
    sections.push({ title: 'Additional Areas', items: tpl.additional.map(label => ({ label, status: null, note: '', priority: INSPECTION_CRITICAL_ITEMS.has(label) ? 'high' : 'medium' })) });
  } else {
    sections = Object.values(tpl.sections).map(sec => ({
      title: sec.title,
      items: sec.items.map(label => ({ label, status: null, note: '', priority: INSPECTION_CRITICAL_ITEMS.has(label) ? 'high' : 'medium' }))
    }));
  }
  draft = { formType, tower: null, sections, needsTower: formType === 'daily-tower', verifiedBy: '', signatureDataUrl: null, inspectionDate: dateToLocalISO(new Date()) };
  if (formType === 'weekly-mep') {
    draft.tankData = {};
    draft.tankPhotos = {};
    tpl.towers.forEach(t => {
      draft.tankData[t] = tpl.tankChecks.map(() => null);
      draft.tankPhotos[t] = tpl.tankChecks.map(() => ({ photoFile: null, photoURL: null }));
    });
    draft.readingsData = {};
    tpl.readings.forEach((label) => { draft.readingsData[label] = ''; });
    draft.maintenanceNotes = '';
  }
  if (formType === 'club-house') {
    draft.complaintsNotes = '';
    draft.incidentNotes = '';
    draft.consentForms = '';
    draft.gymAttendance = '';
    draft.swimAttendance = '';
  }
  renderChecklist();
}

                <input type="file" accept="image/*" data-photo="${si}:${ii}">

  el.querySelectorAll('[data-tank-photo]').forEach(inp => inp.addEventListener('change', () => {
    const [t, ci] = inp.dataset.tankPhoto.split(':');
    const file = inp.files?.[0] || null;
    if (file && file.size >= 8 * 1024 * 1024) {
      showToast(`That photo is ${(file.size / 1024 / 1024).toFixed(1)} MB — please choose one under 8 MB.`, 'error');
      inp.value = '';
      draft.tankPhotos[t][ci].photoFile = null;
      renderChecklist();
      return;
    }
    draft.tankPhotos[t][ci].photoFile = file;
    renderChecklist();
  }));
  el.querySelectorAll('[data-field]').forEach(inp => inp.addEventListener('input', () => { draft[inp.dataset.field] = inp.value; }));
  document.getElementById('inspDate')?.addEventListener('input', (e) => { draft.inspectionDate = e.target.value; });
  document.getElementById('inspVerifiedBy')?.addEventListener('input', (e) => { draft.verifiedBy = e.target.value; });
  initSignaturePad();
  document.getElementById('sigClearBtn')?.addEventListener('click', clearSignaturePad);
  document.getElementById('submitInspBtn').onclick = submitInspection;
  el.addEventListener('input', saveDraftToLocalStorage);
  el.addEventListener('click', saveDraftToLocalStorage);
}

/* ---- signature pad: plain pointer-events drawing on a canvas, exported
   as a PNG data URL at submit time. Uses Pointer Events (not separate
   mouse/touch handlers) so the same code handles a mouse, a finger, or a
   stylus identically. ---- */
let sigCtx = null;
let sigDrawing = false;
let sigHasContent = false;
function initSignaturePad() {
  const canvas = document.getElementById('sigPad');
  if (!canvas) { sigCtx = null; return; }
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, rect.width * dpr);
  canvas.height = Math.max(1, rect.height * dpr);
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(dpr, dpr);
  sigCtx.strokeStyle = '#0A1B33';
  sigCtx.lineWidth = 2;
  sigCtx.lineCap = 'round';
  sigCtx.lineJoin = 'round';
  sigHasContent = !!draft.signatureDataUrl;
  // renderChecklist() replaces this canvas on every single re-render
  // (marking any item, editing a reading, anything) — without restoring
  // from the draft, a signature drawn before that would silently vanish
  // the moment the user touched anything else on the form afterward.
  if (draft.signatureDataUrl) {
    const img = new Image();
    img.onload = () => sigCtx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = draft.signatureDataUrl;
  }
  const posFromEvent = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  canvas.onpointerdown = (e) => {
    sigDrawing = true;
    sigHasContent = true;
    const p = posFromEvent(e);
    sigCtx.beginPath();
    sigCtx.moveTo(p.x, p.y);
    canvas.setPointerCapture(e.pointerId);
  };
  canvas.onpointermove = (e) => {
    if (!sigDrawing) return;
    const p = posFromEvent(e);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
  };
  const endStroke = () => {
    if (!sigDrawing) return;
    sigDrawing = false;
    // Capture into the draft right away — this is what actually survives
    // the next re-render, not the canvas pixels themselves.
    draft.signatureDataUrl = canvas.toDataURL('image/png');
  };
  canvas.onpointerup = endStroke;
  canvas.onpointerleave = endStroke;
}
function clearSignaturePad() {
  const canvas = document.getElementById('sigPad');
  if (!canvas || !sigCtx) return;
  sigCtx.clearRect(0, 0, canvas.width, canvas.height);
  sigHasContent = false;
  draft.signatureDataUrl = null;
}

async function submitInspection() {
  if (inspectionSubmitInFlight) return;
  if (draft.needsTower && !draft.tower) { showToast('Please select a tower.', 'error'); return; }
  if (!draft.inspectionDate) { showToast('Please select the date of inspection.', 'error'); return; }
  if (draft.inspectionDate > todayLocalISO()) { showToast('The date of inspection cannot be in the future.', 'error'); return; }
  if (!draft.verifiedBy || !draft.verifiedBy.trim()) { showToast('Please enter who verified this inspection.', 'error'); return; }
  const allItems = draft.sections.flatMap(sec => sec.items.map(it => ({ ...it, section: sec.title })));
  const tankUnchecked = draft.tankData ? Object.values(draft.tankData).reduce((sum, checks) => sum + checks.filter((v) => v === null).length, 0) : 0;
  const unchecked = allItems.filter(it => !it.status).length + tankUnchecked;
  if (unchecked > 0 && !confirm(unchecked + ' item(s) not marked yet. Submit anyway?')) return;
  const missingRequiredPhoto = allItems.find(it => it.status === 'issue' && it.priority === 'high' && !it.photoFile && !it.photoURL);
  if (missingRequiredPhoto) { showToast(`"${missingRequiredPhoto.label}" is a critical item marked Issue — please attach a photo before submitting.`, 'error'); return; }
  if (draft.formType === 'weekly-mep' && draft.tankData) {
    const tankCheckLabels = INSPECTION_TYPES['weekly-mep'].tankChecks;
    for (const [tower, checks] of Object.entries(draft.tankData)) {
      for (let ci = 0; ci < checks.length; ci++) {
        if (checks[ci] === false && !draft.tankPhotos[tower][ci].photoFile && !draft.tankPhotos[tower][ci].photoURL) {
          showToast(`Tower ${tower} — "${tankCheckLabels[ci]}" is marked Issue — please attach a photo before submitting.`, 'error');
          return;
        }
      }
    }
  }

  const btn = document.getElementById('submitInspBtn');
  inspectionSubmitInFlight = true; window.__appBusy = true;
  btn.disabled = true; btn.textContent = 'Submitting…';
  // Fixed point-in-time copy of everything this submission needs — taken
  // now, right after validation passes and before the upload-await below
  // (which can take several seconds on a slow connection). Every reference
  // from here on reads `snap`, never the live `draft` — so nothing the
  // staff member does to the live draft during that window (marking a
  // different item Issue, switching tower, or discarding it entirely via
  // "Change inspection type", which sets draft=null) can alter what
  // actually gets submitted, or crash mid-upload reading a field off null.
  const snap = structuredClone(draft);
  try {
    const itemsNeedingUpload = snap.sections.flatMap((sec, si) => sec.items.map((it, ii) => ({ it, si, ii })))
      .filter(({ it }) => it.status === 'issue' && it.photoFile && !it.photoURL)
      .map(({ it, si, ii }) => ({ ...it, _section: { si, ii } }));
    const tankCheckLabels = INSPECTION_TYPES['weekly-mep']?.tankChecks || [];
    const tankItemsNeedingUpload = snap.formType === 'weekly-mep' && snap.tankPhotos
      ? Object.entries(snap.tankPhotos).flatMap(([tower, slots]) => slots
          .map((slot, ci) => ({ slot, tower, ci }))
          .filter(({ slot, tower: t, ci }) => snap.tankData[t][ci] === false && slot.photoFile && !slot.photoURL)
          .map(({ slot, tower: t, ci }) => ({ photoFile: slot.photoFile, label: `Tower ${t} — ${tankCheckLabels[ci]}`, priority: 'high', _tank: { tower: t, ci } })))
      : [];
    const allItemsNeedingUpload = [...itemsNeedingUpload, ...tankItemsNeedingUpload];
    const draftStillMatches = draft && draft.formType === snap.formType && draft.tower === snap.tower;
    const uploadResults = await Promise.allSettled(allItemsNeedingUpload.map(async (it) => {
      const r = storageRef(storage, `complaintPhotos/${currentStaff.uid}/issue_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`);
      await uploadBytes(r, it.photoFile);
      const url = await getDownloadURL(r);
      if (it._tank) {
        snap.tankPhotos[it._tank.tower][it._tank.ci].photoURL = url;
        if (draftStillMatches) draft.tankPhotos?.[it._tank.tower]?.[it._tank.ci] && (draft.tankPhotos[it._tank.tower][it._tank.ci].photoURL = url);
      } else {
        snap.sections[it._section.si].items[it._section.ii].photoURL = url;
        if (draftStillMatches) draft.sections?.[it._section.si]?.items?.[it._section.ii] && (draft.sections[it._section.si].items[it._section.ii].photoURL = url);
      }
    }));
    const failedRequiredItem = allItemsNeedingUpload.find((it, i) => uploadResults[i].status === 'rejected' && it.priority === 'high');
    if (failedRequiredItem) {
      showToast(`"${failedRequiredItem.label}" needs a photo (it's a critical item) and the upload failed — please check your connection and try submitting again.`, 'error');
      btn.disabled = false; btn.textContent = 'Submit Inspection';
      inspectionSubmitInFlight = false; window.__appBusy = false;
      return;
    }
    const failedOptionalCount = allItemsNeedingUpload.filter((it, i) => it.priority !== 'high' && uploadResults[i].status === 'rejected').length;
    const freshItems = snap.sections.flatMap(sec => sec.items.map(it => ({ ...it, section: sec.title })));
    // One batch for the inspection AND every auto-created complaint — either
    // all of it lands, or none of it does. Previously each write was a
    // separate addDoc(): a network failure partway through the complaints
    // loop left the inspection (and however many complaints had already
    // gone through) permanently saved, and a retry would then duplicate the
    // whole thing on top of that partial state.
    const batch = writeBatch(db);
    const inspRef = doc(collection(db, 'inspections'));
    // PNG at the canvas's own (device-pixel-ratio-scaled) resolution is
    // already small for a plain line drawing — a signature is a handful of
    // KB at most, well inside the 900KB document-size rule even alongside a
    // daily-tower inspection's ~170 checklist items.
    const signatureDataUrl = snap.signatureDataUrl || null;
    const payload = {
      formType: snap.formType,
      tower: snap.tower || null,
      sections: snap.sections.map(sec => ({ title: sec.title, items: sec.items.map(it => ({ label: it.label, status: it.status || 'unchecked', note: it.note || null, tags: it.tags?.length ? it.tags : null, photoURL: it.photoURL || null })) })),
      issueCount: freshItems.filter(it => it.status === 'issue').length
        + (snap.tankData ? Object.values(snap.tankData).reduce((sum, checks) => sum + checks.filter((v) => v === false).length, 0) : 0),
      uncheckedCount: freshItems.filter(it => !it.status).length
        + (snap.tankData ? Object.values(snap.tankData).reduce((sum, checks) => sum + checks.filter((v) => v === null).length, 0) : 0),
      createdByUid: currentStaff.uid,
      createdByName: currentStaff.name,
      status: 'submitted',
      createdAt: serverTimestamp(),
      inspectionDate: snap.inspectionDate,
      verifiedBy: snap.verifiedBy.trim(),
      signatureDataUrl,
      pendingManagerReview: true
    };
    if (snap.formType === 'weekly-mep') {
      payload.tankData = snap.tankData;
      payload.readingsData = snap.readingsData;
      payload.maintenanceNotes = snap.maintenanceNotes || null;
    }
    if (snap.formType === 'club-house') {
      payload.complaintsNotes = snap.complaintsNotes || null;
      payload.incidentNotes = snap.incidentNotes || null;
      payload.consentForms = snap.consentForms || null;
      payload.gymAttendance = snap.gymAttendance || null;
      payload.swimAttendance = snap.swimAttendance || null;
    }
    batch.set(inspRef, payload);

    // Every flagged item becomes an ordinary complaint — same SLA/escalation
    // system a resident's complaint already goes through, tagged so it's
    // visually distinguishable in that list. Tank checks are included here
    // too — a failed tank check (a leak, an open lid, a stuck float valve)
    // is exactly as real a maintenance issue as any regular checklist item,
    // and deserves the same SLA tracking, not just a higher issueCount with
    // nothing anyone is actually notified to act on.
    const tankIssues = [];
    if (snap.tankData) {
      const tankCheckLabels = INSPECTION_TYPES['weekly-mep'].tankChecks;
      Object.entries(snap.tankData).forEach(([tower, checks]) => {
        checks.forEach((v, i) => {
          if (v === false) tankIssues.push({ label: `Tower ${tower} Tank — ${tankCheckLabels[i]}`, section: 'Water Supply System', priority: 'high', photoURL: snap.tankPhotos?.[tower]?.[i]?.photoURL || null });
        });
      });
    }
    const issues = freshItems.filter(it => it.status === 'issue').concat(tankIssues);
    for (const it of issues) {
      const complaintRef = doc(collection(db, 'complaints'));
      batch.set(complaintRef, {
        raisedByUid: currentStaff.uid,
        title: it.label,
        description: (it.note || 'Flagged during ' + INSPECTION_TYPES[snap.formType].label + (snap.tower ? ' — Tower ' + snap.tower : '') + '.'),
        category: inspectionSectionToComplaintCategory(it.label + ' ' + it.section),
        status: 'open',
        source: 'inspection',
        sourceInspectionId: inspRef.id,
        priority: it.priority,
        ...(it.photoURL ? { photoURL: it.photoURL } : {}),
        ...(it.tags?.length ? { tags: it.tags } : {}),
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
    }

    await batch.commit();
    showToast('Inspection submitted' + (issues.length ? ' — ' + issues.length + ' issue(s) logged.' : '.')
      + (failedOptionalCount ? ` (${failedOptionalCount} photo${failedOptionalCount > 1 ? 's' : ''} could not be uploaded — the inspection itself can't be edited, but you can add ${failedOptionalCount > 1 ? 'them' : 'it'} from the Complaints tab, on the complaint this created.)` : ''),
      failedOptionalCount ? 'error' : 'success');
    draft = null;
    clearSavedDraft();
    await Promise.all([loadMyInspections(), loadComplaints()]);
    showTab('history');
  } catch (err) {
    console.error('Submit inspection failed:', err);
    showToast(`Could not submit${err?.code ? ` (${err.code})` : ''} — please try again.`, 'error');
    btn.disabled = false; btn.textContent = 'Submit Inspection';
  } finally {
    inspectionSubmitInFlight = false; window.__appBusy = false;
  }
}

    el.innerHTML = `<div style="padding:10px 12px; background:#FDEDED; border-radius:8px; font-size:12.5px;">Could not load your inspection history — please check your connection. <button type="button" class="link-btn" id="retryHistoryBtn">Retry</button></div>`;
    document.getElementById('retryHistoryBtn')?.addEventListener('click', () => loadMyInspections().then(renderHistory));
    return;
  }
  if (!myInspections.length) { el.innerHTML = '<p class="t-muted" style="font-size:13px;">No inspections filed yet.</p>'; return; }
  el.innerHTML = myInspections.map(r => `
    <div class="cx-row">
      <div style="display:flex; justify-content:space-between; align-items:start;">
        <div>
          <b style="font-size:13.5px;">${escapeHtml(INSPECTION_TYPES[r.formType]?.label || r.formType)}</b>
          <div class="t-muted" style="font-size:11.5px; margin-top:2px;">${r.tower ? 'Tower ' + escapeHtml(r.tower) + ' · ' : ''}${r.createdAt ? fmtDateTime(r.createdAt) : ''}</div>

/* ---------------------------------------------------------------------- */
/*  Complaints tab — staff can move status forward, same as admin can      */
/* ---------------------------------------------------------------------- */
function staffSuggestedTarget(category) {
  const hours = COMPLAINT_SLA_HOURS[category] ?? 48;
  return dateToLocalISO(new Date(Date.now() + hours * 3600000));
}

const COMPLAINT_STATUS_NEXT = { open: 'in_progress', in_progress: 'resolved' };
const COMPLAINT_STATUS_LABEL = { open: 'Open', in_progress: 'In Progress', resolved: 'Resolved', closed: 'Closed', rejected: 'Rejected' };
const COMPLAINT_STATUS_BADGE = { open: 'warning', in_progress: 'warning', resolved: 'success', closed: 'neutral', rejected: 'neutral' };

// Same recurring-issue signal as admin.html's version (2+ prior occurrences
// of the same title within 30 days) — only meaningful for a Managing Staff,
// who has the full complaint queue in myComplaints; a Supervisor's
// myComplaints is already filtered to just what's assigned to them, so this
// naturally undercounts for that role rather than needing to be hidden.
function recurringCount(c) {
  if (!c.title) return 0;
  const ms = (ts) => ts?.seconds ? ts.seconds * 1000 : 0;
  const created = ms(c.createdAt) || Date.now();
  const cutoff = created - 30 * 24 * 3600000;
  return (myComplaints || []).filter(c2 => c2.id !== c.id && c2.title === c.title
    && ms(c2.createdAt) >= cutoff && ms(c2.createdAt) <= created
  ).length;
}

function renderComplaints() {
  const el = document.getElementById('tab-complaints');
  const isManager = currentStaff.role === 'manager';
  if (complaintsLoadFailed) {
    el.innerHTML = `<div style="padding:10px 12px; background:#FDEDED; border-radius:8px; font-size:12.5px;">Could not load complaints — please check your connection. <button type="button" class="link-btn" id="retryComplaintsBtn">Retry</button></div>`;
    document.getElementById('retryComplaintsBtn')?.addEventListener('click', () => loadComplaints().then(renderComplaints));
    return;
  }
  if (!myComplaints.length) {
    el.innerHTML = `<p class="t-muted" style="font-size:13px;">${isManager ? 'No complaints on record.' : 'No complaints assigned to you yet. A Managing Staff or the committee will assign them.'}</p>`;
    return;
  }
  el.innerHTML = myComplaints.map(c => {
    const sla = complaintUrgency(c);
    const slaBadge = sla === 'breached' ? '<span class="badge badge-danger" style="margin-left:6px;">Overdue</span>'
      : sla === 'due_soon' ? '<span class="badge badge-warning" style="margin-left:6px;">Due soon</span>' : '';
    // A supervisor can only act on complaints assigned to them; a manager
    // sees the queue but acts on the same rule basis (assigned to them) —
    // otherwise the manager assigns first.
    const canAct = c.assignedToUid === currentStaff.uid && COMPLAINT_STATUS_NEXT[c.status];
    return `
    <div class="cx-row">
      <div style="display:flex; justify-content:space-between; align-items:start; gap:8px;">
        <div style="min-width:0;">
          <b style="font-size:13.5px;">${escapeHtml(c.title)}</b>
          <div class="t-muted" style="font-size:11.5px; margin-top:2px;">${escapeHtml(c.category || '')}${c.location ? ' · ' + (c.location === 'common' ? 'Common Area' : 'Inside Flat') : ''}${c.source === 'inspection' ? ' · from inspection' : ' · resident report'}${c.createdAt ? ' · ' + fmtDate(c.createdAt) : ''}</div>
          ${c.assignedToName ? `<div class="t-muted" style="font-size:11px; margin-top:2px;">Assigned to: <b>${escapeHtml(c.assignedToName)}</b></div>` : '<div style="font-size:11px; margin-top:2px; color:var(--danger);">Unassigned</div>'}
          ${c.targetDate ? `<div class="t-muted" style="font-size:11px; margin-top:1px;">Target: ${escapeHtml(c.targetDate)}</div>` : ''}
          ${c.reopenNote ? `<div style="font-size:11px; margin-top:3px; color:var(--danger);">Reopened by resident: ${escapeHtml(c.reopenNote)}</div>` : ''}
          ${c.raisedByUid === currentStaff.uid && !c.photoURL && ['open', 'in_progress'].includes(c.status) ? `
            <label class="btn btn-outline btn-sm" style="display:inline-block; cursor:pointer; margin-top:6px;">Add photo<input type="file" accept="image/*" data-add-staff-photo="${c.id}" style="display:none;"></label>` : ''}
        </div>
        <span style="flex-shrink:0; text-align:right;"><span class="badge badge-${COMPLAINT_STATUS_BADGE[c.status] || 'neutral'}">${COMPLAINT_STATUS_LABEL[c.status] || c.status}</span>${slaBadge}${isManager && recurringCount(c) >= 2 ? '<span class="badge badge-warning" style="margin-left:4px;">🔁</span>' : ''}</span>
      </div>
      ${isManager ? `
        <div style="display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; align-items:center;">
          <select data-assign-sel="${c.id}" style="font-size:12px; padding:5px 8px; border-radius:7px; border:1px solid var(--line); flex:1; min-width:120px;">
            <option value="">— Assign to —</option>
            ${allStaffList.filter(s => s.active !== false && s.role === 'supervisor').map(s => ({ ...s, __rec: STAFF_TRADES[s.trade]?.category === c.category && !!c.category })).sort((a, b) => (b.__rec ? 1 : 0) - (a.__rec ? 1 : 0)).map(s => `<option value="${escapeHtml(s.id)}" ${c.assignedToUid === s.id ? 'selected' : ''}>${escapeHtml(s.name)}${STAFF_TRADES[s.trade] ? ' — ' + STAFF_TRADES[s.trade].label : ''}${s.__rec ? ' ✓' : ''}</option>`).join('')}
          </select>
          <input type="date" data-target-sel="${c.id}" value="${escapeHtml(c.targetDate || staffSuggestedTarget(c.category))}" style="font-size:12px; padding:5px 8px; border-radius:7px; border:1px solid var(--line);">
          <button class="btn btn-outline btn-sm" data-assign-save="${c.id}">Save</button>
        </div>` : ''}
      ${canAct ? `
        ${COMPLAINT_STATUS_NEXT[c.status] === 'resolved' ? `
          <div style="margin-top:8px;">
            <input type="text" data-resolve-note="${c.id}" placeholder="Resolution note (optional)" maxlength="500" style="width:100%; font-size:12.5px; padding:6px 8px; border-radius:7px; border:1px solid var(--line);">
            <div class="t-muted" style="font-size:10.5px; text-align:right; margin-bottom:6px;" data-resolve-note-count="${c.id}">0/500</div>
            <input type="file" accept="image/*" data-resolve-photo="${c.id}" style="font-size:12px;">
          </div>` : ''}
        <button class="btn btn-primary btn-sm" style="margin-top:8px;" data-advance="${c.id}" data-next="${COMPLAINT_STATUS_NEXT[c.status]}">Mark ${COMPLAINT_STATUS_LABEL[COMPLAINT_STATUS_NEXT[c.status]]}</button>` : ''}
    </div>`;
  }).join('');

  el.querySelectorAll('[data-resolve-note]').forEach((inp) => inp.addEventListener('input', () => {
    const counter = el.querySelector(`[data-resolve-note-count="${inp.dataset.resolveNote}"]`);
    if (counter) counter.textContent = `${inp.value.length}/500`;
  }));
  el.querySelectorAll('[data-add-staff-photo]').forEach((inp) => inp.addEventListener('change', () => {
    const file = inp.files?.[0];
    if (file) addStaffComplaintPhoto(inp.dataset.addStaffPhoto, file);
  }));
  el.querySelectorAll('[data-advance]').forEach(b => b.onclick = () => {
    const note = el.querySelector(`[data-resolve-note="${b.dataset.advance}"]`)?.value?.trim() || '';
    const photoFile = el.querySelector(`[data-resolve-photo="${b.dataset.advance}"]`)?.files?.[0] || null;
    advanceComplaint(b.dataset.advance, b.dataset.next, note, photoFile);
  });
  el.querySelectorAll('[data-assign-save]').forEach(b => b.onclick = () => {
    const id = b.dataset.assignSave;
    const staffId = el.querySelector(`[data-assign-sel="${id}"]`).value;
    const targetDate = el.querySelector(`[data-target-sel="${id}"]`).value;
    const staff = allStaffList.find(s => s.id === staffId);
    assignComplaintFromStaff(id, staff, targetDate);
  });
}

async function assignComplaintFromStaff(id, staff, targetDate) {
  try {
    await updateDoc(doc(db, 'complaints', id), {
      assignedToUid: staff?.id || null,
      assignedToName: staff?.name || null,
      assignedAt: serverTimestamp(),
      targetDate: targetDate || null,
      updatedAt: serverTimestamp()
    });
    showToast(staff ? `Assigned to ${staff.name}.` : 'Assignment cleared.', 'success');
    await loadComplaints();
    renderComplaints();
  } catch (err) {
    console.error('Assign failed:', err);
    showToast(`Could not assign${err?.code ? ` (${err.code})` : ''}.`, 'error');
  }
}

async function addStaffComplaintPhoto(complaintId, file) {
  if (file.size >= 8 * 1024 * 1024) { showToast('That photo is too large — please choose one under 8 MB.', 'error'); return; }
  showToast('Uploading photo…', 'success');
  try {
    const r = storageRef(storage, `complaintPhotos/${currentStaff.uid}/complaint_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`);
    await uploadBytes(r, file);
    const photoURL = await getDownloadURL(r);
    await updateDoc(doc(db, 'complaints', complaintId), { photoURL, updatedAt: serverTimestamp() });
    showToast('Photo added.', 'success');
    await loadComplaints();
    renderComplaints();
  } catch (err) {
    console.error('Adding complaint photo failed:', err);
    showToast(`Could not add the photo${err?.code ? ` (${err.code})` : ''} — please try again.`, 'error');
  }
}

async function advanceComplaint(id, nextStatus, note, photoFile) {
  try {
    const payload = { status: nextStatus, updatedAt: serverTimestamp() };
    if (note) payload.resolutionNote = note;
    if (photoFile) {
      const r = storageRef(storage, `complaintPhotos/${currentStaff.uid}/resolution_${Date.now()}`);
      await uploadBytes(r, photoFile);
      payload.resolutionPhotoURL = await getDownloadURL(r);
    }
    if (nextStatus === 'resolved') payload.resolvedAt = serverTimestamp();
    await updateDoc(doc(db, 'complaints', id), payload);
    showToast(nextStatus === 'resolved' ? 'Marked resolved — the resident will be asked to confirm.' : 'Updated.', 'success');
    await loadComplaints();
    renderComplaints();
  } catch (err) {
    console.error('Update complaint failed:', err);
    showToast('Could not update — please try again.', 'error');
  }
}
</script>
