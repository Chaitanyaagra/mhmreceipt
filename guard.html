">

<style>
  /* Deliberately its own small stylesheet, not styles.css's public-site
     layout: this runs on a locked tablet at a gate, often outdoors in
     daylight, tapped by someone who does not have a spare hand for
     precision. Dark, high-contrast, big touch targets, nothing else. */
  *{ box-sizing:border-box; }
  html,body{ margin:0; min-height:calc(100 * var(--vh1)); background:var(--navy-950); color:#fff; font-family:'Inter',system-ui,-apple-system,sans-serif; -webkit-tap-highlight-color:transparent; }
  .screen{ display:none; min-height:calc(100 * var(--vh1)); }
  .screen.active{ display:flex; flex-direction:column; }

  /* ---- Login ---- */
  #screen-login{ padding:0; }
  .login-card{ width:100%; text-align:left; }
  .login-field{ text-align:left; margin-bottom:14px; }
  .login-field label{ display:block; font-size:12.5px; font-weight:600; color:#2B3448; margin-bottom:6px; }
  .login-field input{ width:100%; height:52px; padding:0 14px; border-radius:14px; border:1.5px solid #D9D3C6; background:#fff; color:#10192B; font-size:17px; letter-spacing:.04em; }
  .login-field input:focus{ outline:none; border-color:var(--saffron-500,#F27B0E); }
  #loginError{ display:none; color:#B3261E; font-size:12.5px; margin-bottom:12px; }
  .login-card .btn{ width:100%; height:52px; padding:0 13px; font-size:16px; border-radius:15px; }

  /* ---- Main shell ---- */
  #screen-main .g-header{ display:flex; align-items:center; gap:12px; padding:16px 16px 20px; background:linear-gradient(170deg,#14305C,#0A1B33 80%); border-radius:0 0 24px 24px; flex-shrink:0; box-shadow:0 8px 24px rgba(0,0,0,.25); }
  #screen-main .g-header .who{ flex:1; min-width:0; font-size:13px; }
  #screen-main .g-header .who b{ display:block; font-size:16px; font-family:var(--font-display,Georgia,serif); }
  #screen-main .g-header .who span{ display:inline-block; margin-top:3px; color:#FFC978; background:rgba(255,201,120,.12); border:1px solid rgba(255,201,120,.28); padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; }
  #screen-main .g-header .who span:empty{ display:none; }
  #logoutBtn{ min-height:40px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); color:#fff; padding:8px 14px; border-radius:12px; font-size:12.5px; font-weight:600; }

  @media (min-width:900px){
    #screen-main .g-header{ padding:20px max(28px, calc((100% - 860px) / 2)) 26px; }
    .g-body{ width:100%; max-width:900px; margin:0 auto; padding:28px; }
    .purpose-btn{ padding:22px 8px 18px; font-size:18px; }
  }
  .g-body{ flex:1; overflow-y:auto; padding:16px; padding-bottom:32px; }

  .exp-card{ color:#10192B; background:#fff; border:1px solid var(--line,#e5e7eb); border-radius:14px; padding:14px; margin-bottom:18px; }
  .exp-head{ display:flex; align-items:center; gap:8px; font-size:15px; }
  .exp-n{ background:#1B7A4D; color:#fff; border-radius:999px; font-size:12px; font-weight:700; padding:1px 9px; }
  .exp-sub{ color:#5C6880; font-size:12.5px; margin:2px 0 8px; }
  .exp-search{ width:100%; padding:10px 12px; border:1px solid #D9D3C6; border-radius:10px; font-size:15px; margin-bottom:6px; }
  .exp-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid #EAE6DC; }
  .exp-main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .exp-main b{ font-size:15px; overflow-wrap:anywhere; }
  .exp-main span{ color:#5C6880; font-size:12.5px; overflow-wrap:anywhere; }
  .exp-go{ min-height:44px; min-width:84px; border:0; border-radius:10px; background:#1B7A4D; color:#fff; font-weight:700; font-size:14px; }
  .exp-go:disabled{ opacity:.5; }
  .purpose-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:22px; }
  @media (min-width:700px){ .purpose-grid{ grid-template-columns:repeat(4,1fr); } }
  .purpose-btn{ background:linear-gradient(180deg,#12294F,#0F2547); border:1px solid rgba(255,255,255,.10); border-radius:18px; padding:16px 4px 13px; color:#fff; text-align:center; font-size:12.5px; font-weight:600; box-shadow:0 6px 16px rgba(0,0,0,.25); }
  .purpose-btn:active{ background:var(--navy-800); transform:scale(.97); }
  /* Big, colour-coded, readable at arm's length in daylight. */
  .purpose-btn{ min-height:104px; font-size:18px; font-weight:700; letter-spacing:.01em; border-width:1.5px; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .purpose-btn .ico{ width:56px; height:56px; }
  .purpose-btn .ico svg{ width:34px; height:34px; }
  .purpose-btn[data-purpose="guest"]{ border-color:rgba(52,211,153,.6); } .purpose-btn[data-purpose="guest"] .ico{ background:rgba(52,211,153,.18); color:#6ee7b7; }
  .purpose-btn[data-purpose="delivery"]{ border-color:rgba(251,191,36,.6); } .purpose-btn[data-purpose="delivery"] .ico{ background:rgba(251,191,36,.18); color:#fcd34d; }
  .purpose-btn[data-purpose="cab"]{ border-color:rgba(96,165,250,.6); } .purpose-btn[data-purpose="cab"] .ico{ background:rgba(96,165,250,.18); color:#93c5fd; }
  .purpose-btn[data-purpose="service"]{ border-color:rgba(192,132,252,.6); } .purpose-btn[data-purpose="service"] .ico{ background:rgba(192,132,252,.18); color:#d8b4fe; }
  .exp-go{ min-height:52px; min-width:96px; font-size:16px; }
  .purpose-btn .ico{ display:flex; justify-content:center; margin-bottom:6px; }
  .purpose-btn .ico svg{ width:30px; height:30px; }
  .purpose-btn .ico{ width:48px; height:48px; margin:0 auto 8px; border-radius:15px; background:rgba(255,201,120,.10); align-items:center; }

  .q-label{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:rgba(255,255,255,.45); margin:18px 0 8px; }
  .q-group:first-of-type .q-label{ margin-top:0; }
  .q-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--navy-900); border:1px solid rgba(255,255,255,.07); border-left:3px solid #FFC978; border-radius:14px; padding:13px 14px; margin-bottom:9px; }
  .q-row b{ font-size:14px; }
  .q-sub{ font-size:12px; color:rgba(255,255,255,.5); margin-top:2px; }
  /* Pinch-zoom stays on (older guards need it); this stops the double-tap zoom on buttons instead. */
  button, a, input, select, textarea{ touch-action:manipulation; }
  .q-empty::before{ content:''; display:block; width:56px; height:56px; margin:0 auto 14px; border-radius:50%; border:1.5px solid rgba(255,201,120,.45); background:rgba(255,201,120,.08); }
  .q-empty{ text-align:center; color:rgba(255,255,255,.62); font-size:13px; padding:40px 0; }
  .q-row .btn{ flex-shrink:0; padding:8px 14px; font-size:12.5px; }

  /* ---- Entry sheet ---- */
  .g-sheet-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .g-sheet-backdrop.open{ display:flex; }
  .g-sheet{ width:100%; max-width:420px; background:var(--navy-900); border-radius:20px 20px 0 0; padding:20px; max-height:calc(88 * var(--vh1)); overflow-y:auto; }
  .g-sheet-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .g-sheet-head h3{ font-size:17px; margin:0; color:#fff; }
  .g-sheet-head button{ background:none; border:none; color:rgba(255,255,255,.6); font-size:18px; }
  .g-field{ margin-bottom:12px; }
  .g-field label{ display:block; font-size:12px; color:rgba(255,255,255,.6); margin-bottom:5px; }
  .g-field input, .g-field select{ width:100%; padding:11px 12px; border-radius:9px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05); color:#fff; font-size:15px; }
  .g-row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
<script>
/* Boot guard — if the page's main script cannot start (typically a half-updated cache: a new
   page next to an old script), a login form would otherwise just reload itself, blank, with
   no message. This turns that into a clear message and a one-tap repair. */
(function () {
  window.__moduleBooted = false;
  function show() {
    if (window.__moduleBooted || document.getElementById('bootGuard')) return;
    var d = document.createElement('div');
    d.id = 'bootGuard'; d.setAttribute('role', 'alert');
    d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#B3261E;color:#fff;padding:12px 16px;font:15px/1.4 system-ui,sans-serif;text-align:center';
    d.innerHTML = 'The app did not load completely (an old copy is stored on this phone). ';
    var b = document.createElement('button');
    b.textContent = 'Tap here to fix and reload';
    b.style.cssText = 'margin-left:8px;padding:8px 14px;border:0;border-radius:8px;background:#fff;color:#B3261E;font-weight:700;font-size:15px';
    b.onclick = function () {
      b.disabled = true; b.textContent = 'Fixing…';
      var done = function () { location.replace(location.pathname + '?r=' + Date.now()); };
      Promise.all([
        (navigator.serviceWorker && navigator.serviceWorker.getRegistrations ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : Promise.resolve()),
        (window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : Promise.resolve())
      ]).then(done, done);
    };
    d.appendChild(b);
    (document.body || document.documentElement).appendChild(d);
  }
  window.__showBootGuard = show;
  window.addEventListener('error', function (e) {
    var m = String((e && e.message) || '');
    if (/does not provide an export|Unexpected token|Failed to fetch dynamically|error loading dynamically|Importing a module script failed|SyntaxError|is not defined/i.test(m)) show();
  });
  document.addEventListener('submit', function (e) {
    if (window.__moduleBooted) return;
    e.preventDefault();
    if (document.readyState === 'complete') show();
    else alert('The page is still loading — please wait a moment and try again.');
  }, true);
  window.addEventListener('load', function () { setTimeout(function () { if (!window.__moduleBooted) show(); }, 10000); });
})();
</script>

<div id="toast-region"></div>

<script src="./update-banner.js"></script>
<script src="./back-button-handler.js"></script>
<!-- Service worker registration lives here, not in the Firebase module —
     same reasoning as index.html: if the SDK fails to load, offline
     support and installability shouldn't silently never register. -->
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch((e) => console.warn('Service worker registration failed:', e));
  });
}
</script>

<!-- Offline banner in its own tiny module that imports ONLY the Firebase-free
     ui-a11y.js. It used to be installed from the main module below, whose
     static imports include the Firebase SDK from a CDN — if any one of those
     fails to load, the browser never evaluates that module at all, so the
     offline banner (the very thing meant to explain a bad connection) would
     vanish exactly when the connection is the problem. The resident, admin
     pages already work this way. -->
<script type="module">
import { installOfflineBanner, installAutoLabels } from './ui-a11y.js';
installOfflineBanner();
installAutoLabels();
</script>

<script type="module">
import { auth, db } from './firebase-config.js';
import {
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  doc, getDoc, addDoc, updateDoc, collection, query, where, onSnapshot, serverTimestamp, writeBatch
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { showToast, escapeHtml, TOWER_IDS, flatsForTower, flatKey, getTextSize, setTextSize, todayLocalISO, guestsForGate, visitorFieldsForGuest } from './app-common.js?v=177';
import { installAppInstallPrompt } from './install-prompt.js';

window.__moduleBooted = true; { var __bg = document.getElementById('bootGuard'); if (__bg) __bg.remove(); }
installAppInstallPrompt({ appName: 'MHMRWS Gate', showToast });

let currentGuard = null;
let unsubscribeVisitors = null;
let unsubscribeExpected = null;

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}

/* ---------------------------------------------------------------------- */
/*  Login — a Login ID + PIN, not an email a guard has to remember typing. */
/*  The pair maps deterministically to the real Firebase Auth account     */
/*  (loginId@mhmrws-portal.local) that admin.html's Gate Security tab     */
/*  created; the guard never sees or types that email themselves.         */
/* ---------------------------------------------------------------------- */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const loginId = document.getElementById('loginId').value.trim().toUpperCase();
  const pin = document.getElementById('loginPin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  if (!loginId || !pin) return;
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, `${loginId.toLowerCase()}@mhmrws-portal.local`, pin);
  } catch (err) {
    errEl.textContent = 'Incorrect Login ID or PIN.';
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
// Larger-text switch ("Aa"): remembered on this device.
(() => {
  const b = document.getElementById('textSizeBtn');
  if (!b) return;
  const paint = () => b.setAttribute('aria-pressed', String(getTextSize() === 'large'));
  paint();
  b.addEventListener('click', () => { setTextSize(getTextSize() === 'large' ? 'normal' : 'large'); paint(); });
})();


onAuthStateChanged(auth, async (user) => {
  if (unsubscribeVisitors) { unsubscribeVisitors(); unsubscribeVisitors = null; }
  if (unsubscribeExpected) { unsubscribeExpected(); unsubscribeExpected = null; }
  if (!user) {
    currentGuard = null;
    document.getElementById('loginPin').value = '';
    showScreen('screen-login');
    return;
  }
  try {
    // A guard signing in is still just a Firebase Auth account — the
    // guards/{uid} doc (and its active flag) is what the security rules
    // actually gate every visitors/ write on. This read is what tells the
    // UI whether to proceed, not what grants access; firestore.rules'
    // isGuard() is the real check, re-run on every single write.
    const snap = await getDoc(doc(db, 'guards', user.uid));
    if (!snap.exists() || snap.data().active === false) {
      const errEl = document.getElementById('loginError');
      errEl.textContent = 'This login is not active. Please contact the committee.';
      errEl.style.display = 'block';
      await signOut(auth);
      return;
    }
    currentGuard = { uid: user.uid, ...snap.data() };
    document.getElementById('guardNameLabel').textContent = currentGuard.name || 'Guard';
    { const av = document.getElementById('guardAv'); if (av) av.textContent = ((currentGuard.name || 'G').trim()[0] || 'G').toUpperCase(); }
    document.getElementById('gateLabelText').textContent = currentGuard.gateLabel || '';
    showScreen('screen-main');
    populateTowerSelect();
    subscribeVisitors();
    subscribeExpected();
  } catch (err) {
    console.error('Guard profile load failed:', err);
    const errEl = document.getElementById('loginError');
    errEl.textContent = 'Could not verify this account — check your connection and try again.';
    errEl.style.display = 'block';
    await signOut(auth);
  }
});

/* ---------------------------------------------------------------------- */
/*  Tower / Flat pickers — same TOWER_PLAN every registration form in the  */
/*  app already uses, so what the guard picks here can only ever be a     */
/*  value that actually matches a real member's tower/flatNumber.         */
/* ---------------------------------------------------------------------- */
function populateTowerSelect() {
  const sel = document.getElementById('vTower');
  // Starts on an explicit "Select tower" placeholder rather than silently
  // defaulting to the first tower/flat — a default that looks filled-in is
  // exactly how a hurried entry ends up sent to the wrong resident.
  sel.innerHTML = '<option value="">Select tower</option>' + TOWER_IDS.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('');
  sel.value = '';
  populateFlatSelect();
}
document.getElementById('vTower').addEventListener('change', populateFlatSelect);
function populateFlatSelect() {
  const tower = document.getElementById('vTower').value;
  const sel = document.getElementById('vFlat');
  if (!tower) {
    sel.innerHTML = '<option value="">Select tower first</option>';
    sel.disabled = true;
    return;
  }
  sel.disabled = false;
  sel.innerHTML = '<option value="">Select flat</option>' + flatsForTower(tower).map(g =>
    `<optgroup label="${escapeHtml(g.label)}">` +
    g.flats.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('') +
    `</optgroup>`
  ).join('');
  sel.value = '';
}

/* ---------------------------------------------------------------------- */
/*  Quick-create entry                                                     */
/* ---------------------------------------------------------------------- */
let activePurpose = null;
document.querySelectorAll('[data-purpose]').forEach(btn => btn.addEventListener('click', () => {
  activePurpose = btn.dataset.purpose;
  document.getElementById('entryFormTitle').textContent = `New ${btn.dataset.label} Entry`;
  document.getElementById('vName').value = '';
  document.getElementById('vPhone').value = '';
  // Tower/flat reset too — they used to keep the PREVIOUS visitor's choice,
  // so the next entry could be sent to the wrong resident without the guard
  // ever actively choosing a flat.
  document.getElementById('vTower').value = '';
  populateFlatSelect();
  document.getElementById('entrySheetBackdrop').classList.add('open');
  document.getElementById('vName').focus();
}));
document.getElementById('closeEntrySheet').addEventListener('click', () => document.getElementById('entrySheetBackdrop').classList.remove('open'));
document.getElementById('entrySheetBackdrop').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});

document.getElementById('entryForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('vName').value.trim();
  const tower = document.getElementById('vTower').value;
  const flat = document.getElementById('vFlat').value;
  if (!name || !tower || !flat || !currentGuard) {
    showToast('Please enter the visitor name and select both tower and flat.', 'error');
    return;
  }
  const btn = e.target.querySelector('button[type="submit"]');
  btn.disabled = true;
  try {
    await addDoc(collection(db, 'visitors'), {
      visitorName: name,
      visitorPhone: document.getElementById('vPhone').value.trim() || null,
      purpose: activePurpose,
      tower, flatNumber: flat,
      flatKey: flatKey(tower, flat),
      createdByGuardUid: currentGuard.uid,
      status: 'pending',
      createdAt: serverTimestamp()
    });
    showToast('Sent to the resident for approval.', 'success');
    document.getElementById('entrySheetBackdrop').classList.remove('open');
  } catch (err) {
    console.error('Create visitor entry failed:', err);
    showToast(`Could not send${err?.code ? ` (${err.code})` : ''} — please try again.`, 'error');
  } finally {
    btn.disabled = false;
  }
});

/* ---------------------------------------------------------------------- */
/*  Live queue — a single status-only filter (no orderBy on a different    */
/*  field) so this never needs a Firestore composite index; sorted        */
/*  client-side instead, the same pattern the rest of this app already    */
/*  uses for every list that isn't a single straight equality+orderBy.    */
/* ---------------------------------------------------------------------- */
const PURPOSE_LABEL = { guest: 'Guest', delivery: 'Delivery', cab: 'Cab', service: 'Service', other: 'Other' };

/* ---------------------------------------------------------------------- */
/*  Expected today — guests a resident announced for today. One tap lets   */
/*  them in (checked_in straight away) and marks the announcement arrived. */
/* ---------------------------------------------------------------------- */
let expectedRows = [];
let expectedDay = '';
let expectedSearch = '';
function subscribeExpected() {
  if (unsubscribeExpected) { unsubscribeExpected(); unsubscribeExpected = null; }
  expectedDay = todayLocalISO();
  unsubscribeExpected = onSnapshot(
    query(collection(db, 'expectedGuests'), where('expectedDate', '==', expectedDay)),
    (snap) => { expectedRows = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderExpected(); },
    (err) => { console.warn('Expected guests listener failed:', err?.code || err); expectedRows = []; renderExpected(); }
  );
}
// Past midnight the "today" query is stale: pick up the new day.
setInterval(() => { if (currentGuard && expectedDay && expectedDay !== todayLocalISO()) subscribeExpected(); }, 60000);

function renderExpected() {
  const wrap = document.getElementById('expectedWrap');
  if (!wrap) return;
  const all = guestsForGate(expectedRows, expectedDay, '');
  if (!all.length) { wrap.innerHTML = ''; return; }
  const list = guestsForGate(expectedRows, expectedDay, expectedSearch);
  wrap.innerHTML = `<div class="exp-card">
    <div class="exp-head"><b>Expected today</b><span class="exp-n">${all.length}</span></div>
    <div class="exp-sub">Announced by residents — tap Let in when they arrive.</div>
    ${all.length > 4 ? `<input type="search" id="expSearch" class="exp-search" placeholder="Search name or flat" value="${escapeHtml(expectedSearch)}" autocomplete="off" aria-label="Search expected guests">` : ''}
    ${list.map(g => `<div class="exp-row">
      <div class="exp-main"><b>${escapeHtml(g.guestName)}</b><span>${escapeHtml(g.tower)} · ${escapeHtml(g.flatNumber)}${g.residentName ? ` · ${escapeHtml(g.residentName)}` : ''}${g.purpose ? ` · ${escapeHtml(g.purpose)}` : ''}</span></div>
      <button type="button" class="exp-go" data-let-in="${escapeHtml(g.id)}">Let in</button>
    </div>`).join('') || '<div class="exp-sub" style="padding:8px 0;">Nobody matches that search.</div>'}
  </div>`;
  const inp = document.getElementById('expSearch');
  if (inp) {
    inp.addEventListener('input', (e) => { expectedSearch = e.target.value; const pos = e.target.selectionStart; renderExpected(); const n = document.getElementById('expSearch'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } });
  }
}
document.getElementById('expectedWrap')?.addEventListener('click', async (e) => {
  const b = e.target.closest?.('[data-let-in]');
  if (!b || !currentGuard) return;
  const g = expectedRows.find(x => x.id === b.dataset.letIn);
  if (!g) return;
  b.disabled = true;
  try {
    const batch = writeBatch(db);
    batch.set(doc(collection(db, 'visitors')), {
      ...visitorFieldsForGuest(g, g.id, currentGuard.uid),
      createdAt: serverTimestamp(), decidedAt: serverTimestamp(), checkedInAt: serverTimestamp()
    });
    batch.update(doc(db, 'expectedGuests', g.id), { status: 'arrived', arrivedAt: serverTimestamp(), updatedAt: serverTimestamp() });
    await batch.commit();
    expectedRows = expectedRows.map(x => x.id === g.id ? { ...x, status: 'arrived' } : x);
    renderExpected();
    showToast(`${g.guestName} let in.`, 'success');
  } catch (err) {
    console.error('Let in failed:', err);
    showToast(`Could not let in${err?.code ? ` (${err.code})` : ''} — send for approval instead.`, 'error');
    b.disabled = false;
  }
});

function subscribeVisitors() {
  // Any active guard can now read any visitor (shift handover: a visitor
  // Guard A checked in must still be visible and checkable-out by Guard B),
  // so the query is no longer scoped to createdByGuardUid — that would
  // hide another guard's still-active visitors from the shared queue.
  const q = query(
    collection(db, 'visitors'),
    where('status', 'in', ['pending', 'approved', 'checked_in'])
  );
  unsubscribeVisitors = onSnapshot(q, (snap) => {
    const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    rows.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    renderQueue(rows);
  }, (err) => {
    console.warn('Visitor queue listener failed:', err?.code || err);
    document.getElementById('queueWrap').innerHTML = '<p class="q-empty">Could not load the queue — check your connection.</p>';
  });
}

// An approval is a same-day gate credential: the rules refuse a check-in
// more than 24h after the resident approved it. The queue used to keep
// showing such a visitor under "Approved — let them in" with a live Check
// In button that could only ever fail — so the guard sees it as expired
// instead (the rules stay the actual enforcement; this just stops the UI
// from inviting an action that's bound to be refused).
const APPROVAL_VALID_MS = 24 * 3600 * 1000;
function isApprovalExpired(r) {
  return r.status === 'approved' && !!r.decidedAt?.seconds && (Date.now() - r.decidedAt.seconds * 1000) >= APPROVAL_VALID_MS;
}
let lastQueueRows = [];
// Re-render periodically so an approval that crosses the 24h mark while the
// screen is simply left open flips to "expired" without needing a snapshot.
setInterval(() => { if (lastQueueRows.length) renderQueue(lastQueueRows); }, 60000);

function renderQueue(rows) {
  lastQueueRows = rows;
  const groups = [
    { key: 'pending', label: 'Sent — waiting for the resident', items: rows.filter(r => r.status === 'pending') },
    { key: 'approved', label: 'Approved — let them in', items: rows.filter(r => r.status === 'approved' && !isApprovalExpired(r)) },
    { key: 'expired', label: 'Approval expired — ask the resident again', items: rows.filter(isApprovalExpired) },
    { key: 'checked_in', label: 'Currently inside', items: rows.filter(r => r.status === 'checked_in') }
  ];
  const wrap = document.getElementById('queueWrap');
  if (!groups.some(g => g.items.length)) {
    wrap.innerHTML = '<p class="q-empty">No visitors right now — use a button above to log one in.</p>';
    return;
  }
  wrap.innerHTML = groups.filter(g => g.items.length).map(g => `
    <div class="q-group">
      <div class="q-label">${escapeHtml(g.label)}</div>
      ${g.items.map(rowHtml).join('')}
    </div>`).join('');
  wrap.querySelectorAll('[data-checkin]').forEach(b => b.onclick = () => checkIn(b.dataset.checkin));
  wrap.querySelectorAll('[data-askagain]').forEach(b => b.onclick = () => askAgain(b.dataset.askagain, b));
  wrap.querySelectorAll('[data-checkout]').forEach(b => b.onclick = () => checkOut(b.dataset.checkout));
  wrap.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => cancelVisitor(b.dataset.cancel));
}

function rowHtml(r) {
  return `
    <div class="q-row">
      <div>
        <b>${escapeHtml(r.visitorName)}</b>
        <div class="q-sub">${PURPOSE_LABEL[r.purpose] || escapeHtml(r.purpose || '')} · ${escapeHtml(r.tower || '')}-${escapeHtml(r.flatNumber || '')}</div>
      </div>
      ${r.status === 'approved' && !isApprovalExpired(r) ? `<button class="btn btn-primary btn-sm" data-checkin="${r.id}">Check In</button>` : ''}
      ${isApprovalExpired(r) ? `<button class="btn btn-primary btn-sm" data-askagain="${r.id}">Ask Again</button>` : ''}
      ${r.status === 'checked_in' ? `<button class="btn btn-outline btn-sm on-dark" data-checkout="${r.id}">Check Out</button>` : ''}
      ${['pending', 'approved'].includes(r.status) ? `<button class="btn btn-outline btn-sm on-dark" data-cancel="${r.id}">Cancel</button>` : ''}
    </div>`;
}

async function checkIn(id) {
  const row = lastQueueRows.find(r => r.id === id);
  if (row && isApprovalExpired(row)) {
    showToast('This approval has expired — use Ask Again to get a fresh one.', 'error');
    renderQueue(lastQueueRows);
    return;
  }
  try {
    await updateDoc(doc(db, 'visitors', id), { status: 'checked_in', checkedInAt: serverTimestamp(), updatedAt: serverTimestamp() });
  } catch (err) {
    console.error('Check-in failed:', err);
    showToast('Could not check in — please try again.', 'error');
  }
}
async function checkOut(id) {
  try {
    await updateDoc(doc(db, 'visitors', id), { status: 'checked_out', checkedOutAt: serverTimestamp(), updatedAt: serverTimestamp() });
  } catch (err) {
    console.error('Check-out failed:', err);
    showToast('Could not check out — please try again.', 'error');
  }
}
// Fresh approval for an expired one: sends a brand-new pending request with
// the same details to the same flat, then retires the stale entry. The new
// request is created FIRST — if retiring the old one then fails, the guard
// is left with an extra expired row (harmless), never with the visitor
// having lost their request altogether.
async function askAgain(id, btn) {
  const old = lastQueueRows.find(r => r.id === id);
  if (!old || !currentGuard) return;
  if (btn) btn.disabled = true;
  try {
    await addDoc(collection(db, 'visitors'), {
      visitorName: old.visitorName,
      visitorPhone: old.visitorPhone || null,
      purpose: old.purpose,
      tower: old.tower, flatNumber: old.flatNumber,
      flatKey: flatKey(old.tower, old.flatNumber),
      createdByGuardUid: currentGuard.uid,
      status: 'pending',
      createdAt: serverTimestamp()
    });
    showToast('Sent to the resident for a fresh approval.', 'success');
    try {
      await updateDoc(doc(db, 'visitors', id), { status: 'cancelled', cancelledBy: auth.currentUser.uid, updatedAt: serverTimestamp() });
    } catch (err) {
      console.warn('Could not retire the expired entry:', err);
    }
  } catch (err) {
    console.error('Ask again failed:', err);
    showToast(`Could not send${err?.code ? ` (${err.code})` : ''} — please try again.`, 'error');
    if (btn) btn.disabled = false;
  }
}

async function cancelVisitor(id) {
  if (!confirm('Cancel this visitor entry? This cannot be undone.')) return;
  try {
    await updateDoc(doc(db, 'visitors', id), { status: 'cancelled', cancelledBy: auth.currentUser.uid, updatedAt: serverTimestamp() });
  } catch (err) {
    console.error('Cancel visitor failed:', err);
    showToast('Could not cancel — please try again.', 'error');
  }
}
</script>
</body>
</html>
